[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyboard"
version = "0.1.0"
description = "Tiny dependency-free Python project used to test AgentBox autonomous orchestration."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tinyboard = "tinyboard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
